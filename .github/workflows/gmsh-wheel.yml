# Builds the gmsh 4.15.2 wheel for Linux aarch64 twice from cold, fails unless the two builds are
# byte-identical, smoke-tests the wheel, and, on a manual run from main, publishes it as an
# immutable release. README.md describes the release and how to verify one.
name: gmsh wheel

on:
  pull_request:
    paths:
      - .github/workflows/gmsh-wheel.yml
      - build-wheel.sh
      - smoke.py
  workflow_dispatch:
    inputs:
      build:
        description: Build number. The release is tagged gmsh-4.15.2-<build>, which must not exist yet.
        type: number
        required: true
        default: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push supersedes a pull request's run; a publishing run is never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The whole toolchain (GCC, binutils, CMake, Python, auditwheel) comes from this image, pinned
  # by digest so that a rebuild uses the same compiler. A new digest means a new build number.
  IMAGE: quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.leg }})
    runs-on: ubuntu-24.04-arm
    # A build took about 20 minutes on 3 Apple silicon cores. A runner core may be slower, so
    # this leaves several times that before the job is stopped.
    timeout-minutes: 90
    strategy:
      # Let the other leg finish when one fails, so that both logs are there to compare.
      fail-fast: false
      matrix:
        # Two identical legs on separate runners, each from cold; the reproduce job compares them.
        leg: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the wheel in the pinned manylinux image
        env:
          LEG: ${{ matrix.leg }}
        run: |
          {
            echo "runner: $(nproc) cores, $(uname -m)"
            df -h .
            docker pull "$IMAGE"
            docker run --rm -e JOBS="$(nproc)" -v "$PWD":/work -w /work "$IMAGE" bash build-wheel.sh
          } 2>&1 | tee "build-$LEG.log"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.leg }}
          path: build-${{ matrix.leg }}.log
          if-no-files-found: warn

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.leg }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          # A wheel is already a zip.
          compression-level: 0

  reproduce:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-a
          path: a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-b
          path: b

      - name: Compare the two wheels
        id: compare
        run: |
          shopt -s nullglob
          wa=(a/*.whl)
          wb=(b/*.whl)
          if [ "${#wa[@]}" -ne 1 ] || [ "${#wb[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel from each leg, got ${#wa[@]} and ${#wb[@]}."
            exit 1
          fi
          ha=$(sha256sum < "${wa[0]}" | cut -d' ' -f1)
          hb=$(sha256sum < "${wb[0]}" | cut -d' ' -f1)
          echo "leg a: $ha  ${wa[0]#a/}"
          echo "leg b: $hb  ${wb[0]#b/}"
          {
            echo "| leg | wheel | sha256 |"
            echo "| --- | --- | --- |"
            echo "| a | ${wa[0]#a/} | $ha |"
            echo "| b | ${wb[0]#b/} | $hb |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ha" = "$hb" ] && [ "${wa[0]#a/}" = "${wb[0]#b/}" ]; then
            echo "The two builds are byte-identical."
            exit 0
          fi
          echo "differ=true" >> "$GITHUB_OUTPUT"
          echo "::error::The two builds differ: leg a $ha, leg b $hb. Both wheels stay attached to this run as artifacts."
          # RECORD holds the sha256 of every file in a wheel, so its diff names the files that moved.
          diff <(unzip -p "${wa[0]}" '*.dist-info/RECORD') <(unzip -p "${wb[0]}" '*.dist-info/RECORD') || true
          exit 1

      - name: Show what differs, with diffoscope
        if: failure() && steps.compare.outputs.differ == 'true'
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope-minimal
          # Comparing a large shared library can take a long while; stop diffoscope, not the job.
          timeout 900 diffoscope --text diffoscope.txt --max-report-size 20000000 a/*.whl b/*.whl || true
          head -n 400 diffoscope.txt || true

      - name: Upload the diffoscope report
        if: failure() && steps.compare.outputs.differ == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffoscope
          path: diffoscope.txt
          if-no-files-found: warn

  smoke:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-a
          path: dist

      # The slim image has no apt libraries beyond Python's own, so a library the wheel relies on
      # but does not carry fails here rather than on a consumer's machine. --no-index keeps pip
      # from reaching PyPI for anything.
      - name: Smoke-test with pip in a bare python:3.12-slim container
        run: |
          docker run --rm -w /tmp \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 -e PIP_ROOT_USER_ACTION=ignore \
            -v "$PWD/dist":/dist:ro -v "$PWD/smoke.py":/smoke.py:ro \
            python:3.12-slim sh -c 'pip install --no-index /dist/*.whl && python /smoke.py'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # uv puts the wheel's .data/data/lib/libgmsh.so under <venv>/lib, where gmsh.py looks for
      # it. This is the install path StarCube's tools take.
      - name: Smoke-test with uv in a fresh venv on the runner
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/smoke.py"

  publish:
    needs: [build, reproduce, smoke]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a build number that is already taken
        id: tag
        run: |
          case "$BUILD" in
            '' | 0* | *[!0-9]*)
              echo "::error::The build number must be a positive whole number, got '$BUILD'."
              exit 1
              ;;
          esac
          tag="gmsh-4.15.2-$BUILD"
          # A draft release has no tag yet, so look at the releases (drafts included) and the tags.
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -qxF "$tag" <<< "$releases" || grep -qxF "refs/tags/$tag" <<< "$tags"; then
            echo "::error::$tag already exists as a release, a draft or a tag. Please choose a new build number (a draft left by a failed run can be deleted by hand; a published release cannot)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-a
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-log-*
          merge-multiple: true
          path: dist

      # The release carries the sources as the GPL's corresponding source. The script checks them
      # against the same pinned sha256 the builds used, so these are the bytes that were built.
      - name: Fetch and verify the sources
        run: |
          bash build-wheel.sh --fetch-only
          cp src/gmsh-4.15.2-source.tgz src/occt-7_8_1.tar.gz build-wheel.sh dist/

      - name: Create the draft release, attach the files, then publish it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd dist
          shopt -s nullglob
          wheels=(*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel, got ${#wheels[@]}."
            exit 1
          fi
          wheel=${wheels[0]}
          files=("$wheel" build-a.log build-b.log gmsh-4.15.2-source.tgz occt-7_8_1.tar.gz build-wheel.sh)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          wheel_sha=$(sha256sum < "$wheel" | cut -d' ' -f1)
          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$TAG/$wheel"
          {
            echo "gmsh 4.15.2 for Linux aarch64, built from the attached sources by build-wheel.sh."
            echo
            echo "- Wheel: $url"
            echo "- sha256: $wheel_sha"
            echo "- Built from commit $GITHUB_SHA by $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo "- Image: $IMAGE"
            echo "- The run built the wheel twice, on two runners, with identical bytes, and smoke.py passed with pip and with uv."
            echo
            echo "To rebuild, put the two source tarballs in src/ next to build-wheel.sh and run:"
            echo
            echo "    docker run --rm -e JOBS=4 -v \"\$PWD\":/work -w /work $IMAGE bash build-wheel.sh"
            echo
            echo "gmsh is licensed under the GPL, version 2 or later, with a linking exception; OpenCASCADE under the LGPL 2.1 with the Open CASCADE exception. The attached tarballs and build-wheel.sh are the corresponding source."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "${files[@]}" SHA256SUMS --draft --target "$GITHUB_SHA" \
            --title "gmsh 4.15.2 for Linux aarch64, build $BUILD" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --draft=false
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)
          {
            echo "Published $TAG."
            echo
            echo "- url: $url"
            echo "- sha256: $wheel_sha"
            echo "- immutable: $immutable"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$immutable" != "true" ]; then
            echo "::error::$TAG is published but GitHub does not report it as immutable. Please check that immutable releases are on for this repository before anything pins it."
            exit 1
          fi
